name: DayZ OGG Converter (Windows exe)

on:
  push:
    paths:
      - "DayZ_OggConverter/**"
      - ".github/workflows/dayz-ogg-converter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: DayZ_OggConverter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pyinstaller imageio-ffmpeg

      - name: Fetch ffmpeg (with libvorbis)
        run: |
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ff ffmpeg.exe
          .\ffmpeg.exe -hide_banner -encoders | Select-String libvorbis

      - name: Build single exe
        run: >
          python -m PyInstaller --noconfirm --onefile --windowed
          --name DayZOggConverter
          --exclude-module imageio_ffmpeg
          --add-binary "ffmpeg.exe;."
          dayz_ogg_converter.py

      - name: Smoke test (CLI conversion)
        run: |
          New-Item -ItemType Directory -Force test_in | Out-Null
          .\ffmpeg.exe -hide_banner -loglevel error -f lavfi -i "sine=f=440:d=2" -ac 2 "test_in\Тест Звук.mp3"
          Remove-Item ffmpeg.exe   # проверяем, что используется встроенный ffmpeg
          $p = Start-Process dist\DayZOggConverter.exe -ArgumentList '--cli','test_in','-o','test_out','--config','--mod','TestMod' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Test-Path test_out\test_zvuk.ogg)) { throw "ogg not created" }
          if (-not (Select-String -Path test_out\config.cpp -SimpleMatch 'TestMod\sounds\test_zvuk')) { throw "bad config.cpp" }
          Get-ChildItem test_out

      - name: Smoke test (GUI starts)
        run: |
          $p = Start-Process dist\DayZOggConverter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "GUI exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI is running"

      - uses: actions/upload-artifact@v4
        with:
          name: DayZOggConverter
          path: DayZ_OggConverter/dist/DayZOggConverter.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ogg-converter-latest
          name: DayZ OGG Converter (Windows)
          body: |
            Самостоятельная программа для Windows 10/11: один файл DayZOggConverter.exe,
            ffmpeg уже встроен, Python не нужен. Скачайте и запустите.
          files: DayZ_OggConverter/dist/DayZOggConverter.exe
          make_latest: true
