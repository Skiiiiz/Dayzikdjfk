name: DayZ Mod Toolkit (Windows exe)

on:
  push:
    paths:
      - "DayZ_ModToolkit/**"
      - ".github/workflows/dayz-mod-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: DayZ_ModToolkit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller pytest -r requirements.txt

      - name: Reference data for tests (DayZ scripts, HEMTT signing fixtures)
        working-directory: ${{ runner.temp }}
        run: |
          git clone -q --depth 1 https://github.com/BohemiaInteractive/DayZ-Script-Diff dzscripts
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/BrettMayson/HEMTT hemtt
          git -C hemtt sparse-checkout set libs/signing/tests
          "DAYZ_SCRIPTS=$env:RUNNER_TEMP\dzscripts\scripts" >> $env:GITHUB_ENV
          "HEMTT_SIGNING_TESTS=$env:RUNNER_TEMP\hemtt\libs\signing\tests\ace_ai_3.15.2.69" >> $env:GITHUB_ENV

      - name: Unit tests
        run: python -m pytest -q -rs tests

      - name: Fetch ffmpeg (with libvorbis)
        run: |
          $ff = python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
          Copy-Item $ff ffmpeg.exe
          .\ffmpeg.exe -hide_banner -encoders | Select-String libvorbis

      - name: Build single exe
        run: |
          python tools/version_info.py
          python -m PyInstaller --noconfirm --onefile --windowed `
            --name DayZModToolkit --icon assets/icon.ico --version-file version_info.txt `
            --exclude-module imageio_ffmpeg --exclude-module pytest --exclude-module lzo `
            --add-binary "ffmpeg.exe;." --add-data "assets/icon.png;assets" `
            dayz_toolkit.py

      - name: Smoke test (exe, all modes)
        run: |
          function Run-Exe([string[]]$a) {
            $p = Start-Process dist\DayZModToolkit.exe -ArgumentList $a -Wait -PassThru -NoNewWindow
            if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode): $a" }
          }
          New-Item -ItemType Directory -Force t_in | Out-Null
          .\ffmpeg.exe -hide_banner -loglevel error -f lavfi -i "sine=f=440:d=2" -ac 2 "t_in\Тест Звук.mp3"
          Remove-Item ffmpeg.exe   # дальше работает только встроенный ffmpeg
          Run-Exe @('--cli','audio','t_in','-o','t_ogg','--config','--mod','TestMod')
          if (-not (Test-Path t_ogg\test_zvuk.ogg)) { throw "ogg not created" }
          Run-Exe @('--cli','png','..\SM_PartyMod\GUI\pings','-o','t_png')
          Run-Exe @('--cli','paa','t_png','-o','t_paa')
          if ((Get-ChildItem t_paa\*.paa).Count -ne 15) { throw "paa count" }
          Run-Exe @('--cli','derapify','..\SM_PartyMod\config.bin','-o','t_cfg')
          Run-Exe @('--cli','rapify','t_cfg\config.cpp','-o','t_bin')
          if ((Get-FileHash t_bin\config.bin).Hash -ne (Get-FileHash ..\SM_PartyMod\config.bin).Hash) { throw "rapify mismatch" }
          Run-Exe @('--cli','check','..\SM_PartyMod','t_ogg')
          Run-Exe @('--cli','check','..\SM_PartyMod','--game',"$env:DAYZ_SCRIPTS")
          Run-Exe @('--cli','keygen','CiKey','-o','t_keys')
          Run-Exe @('--cli','pack','..\SM_PartyMod','-o','t_pbo','--key','t_keys\CiKey.biprivatekey')
          Run-Exe @('--cli','verify','t_pbo\@SM_PartyMod\Addons','--key','t_keys\CiKey.bikey')
          if (-not (Test-Path t_pbo\@SM_PartyMod\Keys\CiKey.bikey)) { throw "bikey not copied" }
          Run-Exe @('--cli','unpack','t_pbo\@SM_PartyMod\Addons\SM_PartyMod.pbo','-o','t_unp')
          if ((Get-FileHash t_unp\SM_PartyMod\config.bin).Hash -ne (Get-FileHash ..\SM_PartyMod\config.bin).Hash) { throw "unpack mismatch" }
          Set-Content t_items.cpp 'class CfgVehicles { class Inventory_Base; class MyItem: Inventory_Base { scope = 2; }; };'
          Run-Exe @('--cli','types','t_items.cpp','-o','t_types.xml')
          if (-not (Select-String -Path t_types.xml -SimpleMatch 'name="MyItem"')) { throw "types.xml" }
          Run-Exe @('--lang','en','--cli','check','..\SM_PartyMod','--report','t_report_en.txt')
          if (-not (Select-String -Path t_report_en.txt -SimpleMatch 'Files checked')) { throw "english report" }

      - name: Smoke test (GUI starts)
        run: |
          $p = Start-Process dist\DayZModToolkit.exe -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "GUI exited with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "GUI is running"

      - uses: actions/upload-artifact@v4
        with:
          name: DayZModToolkit
          path: DayZ_ModToolkit/dist/DayZModToolkit.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dayz-toolkit-latest
          target_commitish: ${{ github.sha }}
          name: DayZ Mod Toolkit (Windows)
          body: |
            DayZ Mod Toolkit для Windows 10/11: один файл DayZModToolkit.exe, ffmpeg встроен, установка не нужна.
            Звук → OGG, PNG/TGA ⇄ PAA, config.cpp ⇄ config.bin, сборка и подпись PBO, types.xml,
            проверка мода на ошибки (в т.ч. по классам игры). Интерфейс на русском и английском.
          files: DayZ_ModToolkit/dist/DayZModToolkit.exe
          make_latest: true
